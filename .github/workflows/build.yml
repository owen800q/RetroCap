name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create tags and GitHub Releases

# One run per branch at a time, so back-to-back merges never pick the same version number.
# Pull request runs are superseded by newer pushes; release runs are never cancelled midway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Works out the version to build and whether to publish a release.
  #   Push to master/main -> latest vX.Y.Z tag with the patch number bumped (v1.0 -> v1.0.1), released.
  #   Push of a tag vX.Y.Z -> that version, released (use this to bump major/minor).
  #   Pull request / manual run -> same bumped version, built but not released.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            # Next patch after the latest vX.Y.Z tag. Pull requests build with it too (so the
            # release build path is exercised) but only pushes to master/main publish it.
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+(\.[0-9]+){0,2}$' | head -n1 || true)
            if [[ -z "$latest" ]]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="${major}.${minor:-0}.$(( ${patch:-0} + 1 ))"
            fi
            release=false
            if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF_NAME" == master || "$GITHUB_REF_NAME" == main ) ]]; then
              release=true
            fi
          fi
          echo "Version: $version  release: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check generated icons are up to date
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          python tools/gen_icons.py
          git diff --exit-code -- src/RetroCap/Theme/Icons.xaml

      - name: Publish (self-contained single file)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet publish src/RetroCap/RetroCap.csproj -c Release -r ${{ matrix.rid }} -o dist/${{ matrix.rid }} ${VERSION:+-p:Version=$VERSION}

      - uses: actions/upload-artifact@v4
        with:
          name: RetroCap-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/RetroCap.exe
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist # dist/RetroCap-win-x64/RetroCap.exe, dist/RetroCap-win-arm64/RetroCap.exe

      - name: Package
        shell: bash
        run: |
          for dir in dist/RetroCap-*; do
            (cd "$dir" && zip -j "../../$(basename "$dir").zip" RetroCap.exe)
          done
          ls -l *.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RetroCap v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: RetroCap-*.zip
